 <!-- ================= TIMELINE ================= -->

 <section id="education" class="edu-section pt-3">
    <div class="container-fluid">
        <div class="timeline-section mt-5">

            <div class="section-header text-center ">

                <h1 class="mt-3">EDUCATION</h1>

            </div>

            <div class="timeline">

                <div *ngFor="let item of timeline" class="timeline-item" [ngClass]="item.position">

                    <div class="timeline-content" data-aos="fade-up">

                        <span class="timeline-year">

                            {{ item.year }}

                        </span>

                        <h5>

                            {{ item.title }}

                        </h5>

                        <p>

                            {{ item.description }}

                        </p>

                    </div>

                </div>

            </div>

        </div>
        </div>
        </section>
