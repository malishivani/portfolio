

  <section id="contact" class="contact-section">

  <div class="container">
           <div class="section-header text-center" data-aos="fade-up">

            <h2 class="contact-title ">
                Contact Me
            </h2>

            <div class="title-line"></div>

        </div>

    <div class="row align-items-center min-vh-90">

      <!-- right Content -->
      <div class="col-lg-6 contact-content" data-aos="fade-right">

       <div class="contact-main">
       <h2>Let's Build Something Amazing Together</h2>
        <p class="muted">Have a project, opportunity, or idea in mind? Let’s connect and turn it into a great digital experience.</p>

        </div>


        <div class="social-icons">

          <a href="https://github.com/malishivani"><i class="fab fa-github"></i></a>

          <a href="https://www.linkedin.com/in/shivani-mali-ui-dev/"><i class="fab fa-linkedin"></i></a>

          <a href="shivanimali720@gmail.com"><i class="fas fa-envelope"></i></a>

        </div>

         <div class="contact-info">
          <div><i class="fas fa-envelope"></i> <a href="shivanimali720@gmail.com">shivanimali720@gmail.com</a></div>
          <div><i class="fas fa-phone"></i> +91 *******70</div>
          <div><i class="fas fa-map-marker-alt"></i> Mumbai, India</div>
        </div>

      </div>

    
      
        <!-- left -->
    <div class="col-lg-6 text-center" data-aos="fade-left">

       
        <!-- form -->
           <form class="contact-form card" (ngSubmit)="send()">
            <h3 class="form-title">Get In Touch</h3>
        <div class="form-row">
          <input name="name" [(ngModel)]="name" placeholder="Your name" required />
          <input name="email" [(ngModel)]="email" placeholder="Your email" required />
        </div>
        <textarea name="message" [(ngModel)]="message" rows="6" placeholder="Your message" required></textarea>
        <div class="form-actions">
          <button class="btn primary" type="submit">Send Message</button>
        </div>
      </form>

      </div>

     

    </div>
  </div>

</section>
